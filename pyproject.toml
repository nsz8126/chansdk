[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chansdk"
version = "1.0.2"
description = "缠论核心算法SDK - 纯Python实现，零外部依赖"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["chan", "缠论", "缠中说禅", "technical-analysis", "quant", "kline", "stock"]
dependencies = []

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/nsz8126/chansdk"
Repository = "https://github.com/nsz8126/chansdk"
Issues = "https://github.com/nsz8126/chansdk/issues"
Changelog = "https://github.com/nsz8126/chansdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
eltdx = ["eltdx>=3.0.0"]
all = ["eltdx>=3.0.0"]
dev = ["pytest>=7.0", "build>=1.2"]

[tool.setuptools.packages.find]
include = ["chan*"]
