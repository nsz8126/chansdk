[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chansdk"
version = "1.0.1"
description = "缠论核心算法SDK - 纯Python实现，零外部依赖"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
eltdx = ["eltdx>=3.0.0"]
all = ["eltdx>=3.0.0"]
dev = ["pytest>=7.0", "build>=1.2"]

[tool.setuptools.packages.find]
include = ["chan*"]
